    <style>

body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.8;
}

header {
    text-align: center;
    padding: 40px 20px 25px;
    border-bottom: 1px solid #333;
}

header h1 {
    margin: 0;
    color: #d4af37;
    font-size: 28px;
    letter-spacing: 4px;
    font-weight: normal;
}

header p {
    margin: 8px 0 0;
    letter-spacing: 2px;
    color: #aaa;
}

main {
    max-width: 700px;
    margin: 0 auto;
    padding: 70px 30px;
}

h2 {
    text-align: center;
    color: #d4af37;
    font-size: 30px;
    font-weight: normal;
    letter-spacing: 3px;
}

.login-box,

    border-top: 1px solid #d4af37;

label {
    display: block;
    color: #d4af37;

    letter-spacing: 1px;
}

input {
    width: 100%;
    box-sizing: border-box;
    background: #181818;
    color: #eee;
    border: 1px solid #555;
    padding: 12px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px;
}

input:focus {
    outline: none;
    border-color: #d4af37;
}

button {
    display: block;
    margin: 35px auto 0;
    background: transparent;
    color: #d4af37;
    border: 1px solid #d4af37;
    padding: 12px 28px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px;
    letter-spacing: 2px;
    cursor: pointer;
}

button:hover {
    background: #d4af37;
    color: #111;
}

.counter {
    text-align: center;
    border: 1px solid #d4af37;
    padding: 35px 20px;
    margin-top: 35px;
}

.counter-number {
    display: block;
    color: #d4af37;
    font-size: 56px;
    line-height: 1;
    margin-bottom: 15px;
}

.counter-label {
    letter-spacing: 3px;
    font-size: 16px;
}

.message {
    text-align: center;
    color: #aaa;
    margin-top: 25px;
}

.logout {
    margin-top: 45px;
}

.hidden {
    display: none;
}

footer {
    text-align: center;
    border-top: 1px solid #333;
    padding: 30px;
    color: #888;
    font-size: 14px;
}

</style>
</head>

<body>

<header>

<h1>RICHARD OSWESTRY</h1>
<p>PRIVATE READER'S ROOM</p>

</header>

<main>

<div id="loginSection">

<h2>AUTHOR LOGIN</h2>

<div class="login-box">

<label for="email">EMAIL ADDRESS</label>
<input type="email" id="email" autocomplete="email">

<label for="password">PASSWORD</label>
<input type="password" id="password" autocomplete="current-password">

<button id="loginButton">SIGN IN</button>

<p id="loginMessage" class="message"></p>

</div>

</div>


<div id="dashboardSection" class="dashboard hidden">

<h2>READER'S ROOM</h2>

<h2 style="margin-top: 45px;">SITE STATISTICS</h2>

<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 30px;">

    <div class="counter">
        <span id="todayVisits" class="counter-number">0</span>
        <span class="counter-label">TODAY</span>
    </div>

    <div class="counter">
        <span id="sevenDayVisits" class="counter-number">0</span>
        <span class="counter-label">7 DAYS</span>
    </div>

    <div class="counter">
        <span id="thirtyDayVisits" class="counter-number">0</span>
        <span class="counter-label">30 DAYS</span>
    </div>

    <div class="counter">
        <span id="allTimeVisits" class="counter-number">0</span>
        <span class="counter-label">ALL TIME</span>
    </div>

</div>
  </div>

<!-- VISITOR MAP -->
<h2 style="margin-top: 45px;">VISITOR MAP</h2>

<div id="visitorMap" style="height: 500px; width: 100%; border: 1px solid #333; margin-bottom: 30px;"></div>


<div class="counter">

<span id="pendingCount" class="counter-number">0</span>

<span class="counter-label">
PENDING QUESTIONS
</span>

</div>
<div id="questionList"></div>
<p id="dashboardMessage" class="message"></p>
<h2 style="margin-top: 60px;">PUBLISHED QUESTIONS</h2>

<div id="publishedList"></div>
<button id="logoutButton" class="logout">
SIGN OUT
</button>

</div>

</main>

<footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://frskyxuttbfczdlcpblc.supabase.co";

/*
Use the same public/anon key already working
in reader-submit.html.
*/

const SUPABASE_PUBLISHABLE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyc2t5eHV0dGJmY3pkbGNwYmxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzk2MjksImV4cCI6MjEwMjcxNTYyOX0.U6dZ_OsSLld5XIpqFzEmUyDfQDcXtZzShL6UCQbN8MQ";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


const loginSection =
document.getElementById("loginSection");

const dashboardSection =
document.getElementById("dashboardSection");

const loginButton =
document.getElementById("loginButton");

const logoutButton =
document.getElementById("logoutButton");

const loginMessage =
document.getElementById("loginMessage");

const dashboardMessage =
document.getElementById("dashboardMessage");

const pendingCount =
document.getElementById("pendingCount");


async function loadPendingCount() {

    const { data, error } = await supabaseClient
        .from("reader_questions")
        .select("id, created_at, name, email, book, question, status")
        .eq("status", "pending")
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        dashboardMessage.textContent =
            "Unable to load pending questions.";
        return;
    }

    pendingCount.textContent = data.length;

    const questionList =
        document.getElementById("questionList");

    questionList.innerHTML = "";

    if (data.length === 0) {
        questionList.innerHTML =
            "<p class='message'>No pending questions.</p>";
        return;
    }

    data.forEach(function(item) {

        const box = document.createElement("div");

        box.style.borderTop = "1px solid #333";
        box.style.padding = "30px 0";
        box.style.marginTop = "30px";

      const bookTitle = document.createElement("p");
bookTitle.style.color = "#d4af37";
bookTitle.style.letterSpacing = "2px";
bookTitle.textContent = item.book;

const reader = document.createElement("p");
reader.innerHTML = "<strong>Reader:</strong> ";
reader.appendChild(document.createTextNode(item.name));

const email = document.createElement("p");
email.innerHTML = "<strong>Email:</strong> ";
email.appendChild(document.createTextNode(item.email));

const questionLabel = document.createElement("p");
questionLabel.innerHTML = "<strong>Question:</strong>";

const question = document.createElement("p");
question.textContent = item.question;

box.appendChild(bookTitle);
box.appendChild(reader);
box.appendChild(email);
box.appendChild(questionLabel);
box.appendChild(question);
        const rejectButton = document.createElement("button");
rejectButton.textContent = "REJECT";
rejectButton.style.margin = "25px 10px 0 0";
const approveButton = document.createElement("button");
approveButton.textContent = "APPROVE";
approveButton.style.margin = "25px 10px 0 0";

approveButton.addEventListener("click", async function() {

    const answer = prompt("Enter your answer to this question:");

    if (answer === null) {
        return;
    }

    if (answer.trim() === "") {
        alert("Please enter an answer.");
        return;
    }

    const { error } = await supabaseClient
        .from("reader_questions")
        .update({
            status: "approved",
            answer: answer.trim()
        })
        .eq("id", item.id);

    if (error) {
        console.error(error);
        alert("Unable to approve this question.");
        return;
    }

    alert("Question approved and answer saved.");

    await loadPendingCount();
});
        

box.appendChild(approveButton);

rejectButton.addEventListener("click", async function() {

    const { error } = await supabaseClient
        .from("reader_questions")
        .update({ status: "rejected" })
        .eq("id", item.id);

    if (error) {
        console.error(error);
        alert("Unable to reject this question.");
        return;
    }

    await loadPendingCount();
});

box.appendChild(rejectButton);

        questionList.appendChild(box);
    });
}

async function loadPublishedQuestions() {

    const { data, error } = await supabaseClient
        .from("reader_questions")
        .select("id, created_at, name, book, question, answer, status")
        .eq("status", "approved")
        .not("answer", "is", null)
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        return;
    }

    const publishedList = document.getElementById("publishedList");

    if (!publishedList) {
        return;
    }

    publishedList.innerHTML = "";

    if (data.length === 0) {
        publishedList.innerHTML =
            "<p class='message'>No published questions.</p>";
        return;
    }

    data.forEach(function(item) {

        const box = document.createElement("div");

        box.style.borderTop = "1px solid #333";
        box.style.padding = "30px 0";
        box.style.marginTop = "30px";

        const bookTitle = document.createElement("p");
        bookTitle.style.color = "#d4af37";
        bookTitle.style.letterSpacing = "2px";
        bookTitle.textContent = item.book;

        const reader = document.createElement("p");
        reader.innerHTML = "<strong>Reader:</strong> ";
        reader.appendChild(document.createTextNode(item.name));

        const question = document.createElement("p");
        question.innerHTML = "<strong>Question:</strong> ";
        question.appendChild(document.createTextNode(item.question));

        const answer = document.createElement("p");
        answer.innerHTML = "<strong>Richard Oswestry:</strong> ";
        answer.appendChild(document.createTextNode(item.answer));

        const removeButton = document.createElement("button");
        removeButton.textContent = "REMOVE";
        removeButton.style.margin = "25px 10px 0 0";

        removeButton.addEventListener("click", async function() {

            if (!confirm("Remove this published question from the Reader's Room?")) {
                return;
            }

            const { error } = await supabaseClient
                .from("reader_questions")
                .update({ status: "rejected" })
                .eq("id", item.id);

            if (error) {
                console.error(error);
                alert("Unable to remove this question.");
                return;
            }

            await loadPublishedQuestions();
        });
        box.appendChild(bookTitle);
        box.appendChild(reader);
        box.appendChild(question);
        box.appendChild(answer);
        box.appendChild(removeButton);

        publishedList.appendChild(box);
    });
}
      
async function loadSiteStatistics() {

    const now = new Date();

    const todayStart = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
    );

    const sevenDayStart = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate() - 6
    );

    const thirtyDayStart = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate() - 29
    );

    const todayResult = await supabaseClient
        .from("site_visitors")
        .select("*", { count: "exact", head: true })
        .gte("visited_at", todayStart.toISOString());

    const sevenDayResult = await supabaseClient
        .from("site_visitors")
        .select("*", { count: "exact", head: true })
        .gte("visited_at", sevenDayStart.toISOString());

    const thirtyDayResult = await supabaseClient
        .from("site_visitors")
        .select("*", { count: "exact", head: true })
        .gte("visited_at", thirtyDayStart.toISOString());

    const allTimeResult = await supabaseClient
        .from("site_visitors")
        .select("*", { count: "exact", head: true });

    if (
        todayResult.error ||
        sevenDayResult.error ||
        thirtyDayResult.error ||
        allTimeResult.error
    ) {
   console.error("Unable to load site statistics.");

        return;
    }

    document.getElementById("todayVisits").textContent =
        todayResult.count;

    document.getElementById("sevenDayVisits").textContent =
        sevenDayResult.count;

    document.getElementById("thirtyDayVisits").textContent =
        thirtyDayResult.count;

    document.getElementById("allTimeVisits").textContent =
        allTimeResult.count;
}


    async function showDashboard() {

    loginSection.classList.add("hidden");
    dashboardSection.classList.remove("hidden");

   await loadPendingCount();
await loadPublishedQuestions();
await loadSiteStatistics();
}
loginButton.addEventListener("click", async function() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    loginMessage.textContent = "SIGNING IN...";

    const { error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        console.error(error);

        loginMessage.textContent =
            "Login failed. Please check your details.";

        return;
    }

    loginMessage.textContent = "";

    await showDashboard();

});


logoutButton.addEventListener("click", async function() {

    await supabaseClient.auth.signOut();

    dashboardSection.classList.add("hidden");
    loginSection.classList.remove("hidden");

    pendingCount.textContent = "0";

});


supabaseClient.auth.getSession().then(async function(result) {

    if (result.data.session) {
        await showDashboard();
    }

});

</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(async function () {
    const mapElement = document.getElementById("visitorMap");

    if (!mapElement) return;

    const map = L.map("visitorMap").setView([20, 0], 2);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const { data, error } = await supabaseClient
        .from("site_visitors")
        .select("city, country, latitude, longitude, visited_at")
        .not("latitude", "is", null)
        .not("longitude", "is", null);

    if (error) {
        console.error("Visitor map error:", error);
        return;
    }

    const grouped = {};

data.forEach(function (visitor) {
    const key = (visitor.city || "Unknown city") + ", " +
                (visitor.country || "Unknown country");

    if (!grouped[key]) {
        grouped[key] = {
            city: visitor.city || "Unknown city",
            country: visitor.country || "Unknown country",
            latitude: visitor.latitude,
            longitude: visitor.longitude,
            count: 0,
            lastVisit: visitor.visited_at
        };
    }

    grouped[key].count++;

    if (visitor.visited_at > grouped[key].lastVisit) {
        grouped[key].lastVisit = visitor.visited_at;
    }
});

Object.values(grouped).forEach(function (visitor) {
    const marker = L.marker([
        visitor.latitude,
        visitor.longitude
    ]).addTo(map);

    const date = visitor.lastVisit
        ? new Date(visitor.lastVisit).toLocaleString()
        : "Unknown date";

    marker.bindPopup(
        "<strong>" +
        visitor.city + ", " +
        visitor.country +
        "</strong><br>" +
        "Visitors: " + visitor.count +
        "<br>Last visit: " + date
    );
});
       

    setTimeout(function () {
        map.invalidateSize();
    }, 500);
})();
</script>
