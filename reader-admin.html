<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reader's Room Admin | Richard Oswestry</title>

<style>

body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.8;
}

header {
    text-align: center;
    padding: 40px 20px 25px;
    border-bottom: 1px solid #333;
}

header h1 {
    margin: 0;
    color: #d4af37;
    font-size: 28px;
    letter-spacing: 4px;
    font-weight: normal;
}

header p {
    margin: 8px 0 0;
    letter-spacing: 2px;
    color: #aaa;
}

main {
    max-width: 700px;
    margin: 0 auto;
    padding: 70px 30px;
}

h2 {
    text-align: center;
    color: #d4af37;
    font-size: 30px;
    font-weight: normal;
    letter-spacing: 3px;
}

.login-box,
.dashboard {
    border-top: 1px solid #d4af37;
    padding-top: 35px;
    margin-top: 40px;
}

label {
    display: block;
    color: #d4af37;
    margin-top: 22px;
    margin-bottom: 8px;
    letter-spacing: 1px;
}

input {
    width: 100%;
    box-sizing: border-box;
    background: #181818;
    color: #eee;
    border: 1px solid #555;
    padding: 12px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px;
}

input:focus {
    outline: none;
    border-color: #d4af37;
}

button {
    display: block;
    margin: 35px auto 0;
    background: transparent;
    color: #d4af37;
    border: 1px solid #d4af37;
    padding: 12px 28px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px;
    letter-spacing: 2px;
    cursor: pointer;
}

button:hover {
    background: #d4af37;
    color: #111;
}

.counter {
    text-align: center;
    border: 1px solid #d4af37;
    padding: 35px 20px;
    margin-top: 35px;
}

.counter-number {
    display: block;
    color: #d4af37;
    font-size: 56px;
    line-height: 1;
    margin-bottom: 15px;
}

.counter-label {
    letter-spacing: 3px;
    font-size: 16px;
}

.message {
    text-align: center;
    color: #aaa;
    margin-top: 25px;
}

.logout {
    margin-top: 45px;
}

.hidden {
    display: none;
}

footer {
    text-align: center;
    border-top: 1px solid #333;
    padding: 30px;
    color: #888;
    font-size: 14px;
}

</style>
</head>

<body>

<header>

<h1>RICHARD OSWESTRY</h1>
<p>PRIVATE READER'S ROOM</p>

</header>

<main>

<div id="loginSection">

<h2>AUTHOR LOGIN</h2>

<div class="login-box">

<label for="email">EMAIL ADDRESS</label>
<input type="email" id="email" autocomplete="email">

<label for="password">PASSWORD</label>
<input type="password" id="password" autocomplete="current-password">

<button id="loginButton">SIGN IN</button>

<p id="loginMessage" class="message"></p>

</div>

</div>


<div id="dashboardSection" class="dashboard hidden">

<h2>READER'S ROOM</h2>

<div class="counter">

<span id="pendingCount" class="counter-number">0</span>

<span class="counter-label">
PENDING QUESTIONS
</span>

</div>
<div id="questionList"></div>
<p id="dashboardMessage" class="message"></p>
<h2 style="margin-top: 60px;">PUBLISHED QUESTIONS</h2>

<div id="publishedList"></div>
<button id="logoutButton" class="logout">
SIGN OUT
</button>

</div>

</main>

<footer>
© 2026 Richard Oswestry
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://frskyxuttbfczdlcpblc.supabase.co";

/*
Use the same public/anon key already working
in reader-submit.html.
*/

const SUPABASE_PUBLISHABLE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyc2t5eHV0dGJmY3pkbGNwYmxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzk2MjksImV4cCI6MjEwMjcxNTYyOX0.U6dZ_OsSLld5XIpqFzEmUyDfQDcXtZzShL6UCQbN8MQ";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


const loginSection =
document.getElementById("loginSection");

const dashboardSection =
document.getElementById("dashboardSection");

const loginButton =
document.getElementById("loginButton");

const logoutButton =
document.getElementById("logoutButton");

const loginMessage =
document.getElementById("loginMessage");

const dashboardMessage =
document.getElementById("dashboardMessage");

const pendingCount =
document.getElementById("pendingCount");


async function loadPendingCount() {

    const { data, error } = await supabaseClient
        .from("reader_questions")
        .select("id, created_at, name, email, book, question, status")
        .eq("status", "pending")
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        dashboardMessage.textContent =
            "Unable to load pending questions.";
        return;
    }

    pendingCount.textContent = data.length;

    const questionList =
        document.getElementById("questionList");

    questionList.innerHTML = "";

    if (data.length === 0) {
        questionList.innerHTML =
            "<p class='message'>No pending questions.</p>";
        return;
    }

    data.forEach(function(item) {

        const box = document.createElement("div");

        box.style.borderTop = "1px solid #333";
        box.style.padding = "30px 0";
        box.style.marginTop = "30px";

      const bookTitle = document.createElement("p");
bookTitle.style.color = "#d4af37";
bookTitle.style.letterSpacing = "2px";
bookTitle.textContent = item.book;

const reader = document.createElement("p");
reader.innerHTML = "<strong>Reader:</strong> ";
reader.appendChild(document.createTextNode(item.name));

const email = document.createElement("p");
email.innerHTML = "<strong>Email:</strong> ";
email.appendChild(document.createTextNode(item.email));

const questionLabel = document.createElement("p");
questionLabel.innerHTML = "<strong>Question:</strong>";

const question = document.createElement("p");
question.textContent = item.question;

box.appendChild(bookTitle);
box.appendChild(reader);
box.appendChild(email);
box.appendChild(questionLabel);
box.appendChild(question);
        const rejectButton = document.createElement("button");
rejectButton.textContent = "REJECT";
rejectButton.style.margin = "25px 10px 0 0";
const approveButton = document.createElement("button");
approveButton.textContent = "APPROVE";
approveButton.style.margin = "25px 10px 0 0";

approveButton.addEventListener("click", async function() {

    const answer = prompt("Enter your answer to this question:");

    if (answer === null) {
        return;
    }

    if (answer.trim() === "") {
        alert("Please enter an answer.");
        return;
    }

    const { error } = await supabaseClient
        .from("reader_questions")
        .update({
            status: "approved",
            answer: answer.trim()
        })
        .eq("id", item.id);

    if (error) {
        console.error(error);
        alert("Unable to approve this question.");
        return;
    }

    alert("Question approved and answer saved.");

    await loadPendingCount();
});
        

box.appendChild(approveButton);

rejectButton.addEventListener("click", async function() {

    const { error } = await supabaseClient
        .from("reader_questions")
        .update({ status: "rejected" })
        .eq("id", item.id);

    if (error) {
        console.error(error);
        alert("Unable to reject this question.");
        return;
    }

    await loadPendingCount();
});

box.appendChild(rejectButton);

        questionList.appendChild(box);
    });
}

async function loadPublishedQuestions() {

    const { data, error } = await supabaseClient
        .from("reader_questions")
        .select("id, created_at, name, book, question, answer, status")
        .eq("status", "approved")
        .not("answer", "is", null)
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        return;
    }

    const publishedList = document.getElementById("publishedList");

    if (!publishedList) {
        return;
    }

    publishedList.innerHTML = "";

    if (data.length === 0) {
        publishedList.innerHTML =
            "<p class='message'>No published questions.</p>";
        return;
    }

    data.forEach(function(item) {

        const box = document.createElement("div");

        box.style.borderTop = "1px solid #333";
        box.style.padding = "30px 0";
        box.style.marginTop = "30px";

        const bookTitle = document.createElement("p");
        bookTitle.style.color = "#d4af37";
        bookTitle.style.letterSpacing = "2px";
        bookTitle.textContent = item.book;

        const reader = document.createElement("p");
        reader.innerHTML = "<strong>Reader:</strong> ";
        reader.appendChild(document.createTextNode(item.name));

        const question = document.createElement("p");
        question.innerHTML = "<strong>Question:</strong> ";
        question.appendChild(document.createTextNode(item.question));

        const answer = document.createElement("p");
        answer.innerHTML = "<strong>Richard Oswestry:</strong> ";
        answer.appendChild(document.createTextNode(item.answer));

        const removeButton = document.createElement("button");
        removeButton.textContent = "REMOVE";
        removeButton.style.margin = "25px 10px 0 0";

        removeButton.addEventListener("click", async function() {

            if (!confirm("Remove this published question from the Reader's Room?")) {
                return;
            }

            const { error } = await supabaseClient
                .from("reader_questions")
                .update({ status: "rejected" })
                .eq("id", item.id);

            if (error) {
                console.error(error);
                alert("Unable to remove this question.");
                return;
            }

            await loadPublishedQuestions();
        });
        box.appendChild(bookTitle);
        box.appendChild(reader);
        box.appendChild(question);
        box.appendChild(answer);
        box.appendChild(removeButton);

        publishedList.appendChild(box);
    });
}
      
    async function showDashboard() {

    loginSection.classList.add("hidden");
    dashboardSection.classList.remove("hidden");

   await loadPendingCount();
await loadPublishedQuestions();


loginButton.addEventListener("click", async function() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    loginMessage.textContent = "SIGNING IN...";

    const { error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        console.error(error);

        loginMessage.textContent =
            "Login failed. Please check your details.";

        return;
    }

    loginMessage.textContent = "";

    await showDashboard();

});


logoutButton.addEventListener("click", async function() {

    await supabaseClient.auth.signOut();

    dashboardSection.classList.add("hidden");
    loginSection.classList.remove("hidden");

    pendingCount.textContent = "0";

});


supabaseClient.auth.getSession().then(async function(result) {

    if (result.data.session) {
        await showDashboard();
    }

});

</script>

</body>
</html>
